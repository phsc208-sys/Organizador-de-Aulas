[package]
name = "transcritor-aulas"
version = "0.1.0"
description = "Grava aulas, transcreve com whisper.cpp e gera atas com o Gemini"
edition = "2021"

[lib]
name = "transcritor_aulas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = "0.4"
tokio = { version = "1", features = ["sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
cpal = "0.15"
hound = "3.5"
rubato = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
